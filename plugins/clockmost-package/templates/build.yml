# Per-package workflow. This is the ONLY file each package repo customises —
# set pkgname and pick rust-pkg or generic-pkg. All the gates live in
# pkgs/packaging so they can't be weakened here.
name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  pkg:
    uses: pkgs/packaging/.gitea/workflows/rust-pkg.yml@main
    with:
      pkgname: CHANGE-ME
      # extra_pacman_deps: "wayland libxkbcommon vulkan-icd-loader libglvnd mesa fontconfig freetype2 expat"
    secrets:
      PACKAGE_TOKEN: ${{ secrets.PACKAGE_TOKEN }}
